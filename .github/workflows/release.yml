name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing (provenance is automatic)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # Trusted publishing needs npm >= 11.5.1. Pin it (not @latest): npm 12+ dropped
      # support for Node 20, so `npm install -g npm@latest` fails EBADENGINE here.
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check tag matches package version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: tag v$TAG_VERSION, package.json v$PKG_VERSION" >&2
            exit 1
          fi
      # Auth via OIDC trusted publishing — no NPM_TOKEN, no stored secret.
      - run: npm publish --access public
